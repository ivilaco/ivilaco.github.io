title: "Ivonne Lara Cortés"
description: "Economista interesada en desarrollo, conflicto y género"
url: "https://ivilaco.github.io"

remote_theme: "mmistakes/minimal-mistakes"

plugins:
  - jekyll-include-cache

minimal_mistakes_skin: "default"

author:
  name   : "Ivonne Lara Cortés"
  avatar : "/assets/images/IMG_5072.jpeg"
  bio    : "Economist | Development • Conflict • Gender"
  links:
    - label: "Email"
      icon: "fas fa-envelope"
      url: "mailto:ivilaco@hotmail.com"
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: "https://www.linkedin.com/in/ivonnelara/"
    - label: "X"
      icon: "fab fa-x-twitter"
      url: "https://x.com/Ivslaco"

include:
  - _pages

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
